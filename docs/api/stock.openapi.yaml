openapi: 3.1.0
info:
  title: Offshore Ops – stock-service
  version: 0.1.0
  description: "Articles, entrepôts, mouvements et niveaux de stock. Généré depuis
    les schémas zod de @offshore/shared : ne pas éditer à la main."
servers:
  - url: http://localhost:4002
    description: Local (via la gateway en sprint 2)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
            correlationId:
              type: string
          required:
            - code
            - message
      required:
        - error
    Item:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        category:
          type:
            - string
            - "null"
        unit:
          type: string
        threshold:
          type: integer
        defaultWarehouseId:
          type:
            - string
            - "null"
          format: uuid
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - companyId
        - sku
        - name
        - category
        - unit
        - threshold
        - defaultWarehouseId
        - archived
        - createdAt
    Warehouse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - companyId
        - name
        - createdAt
    Movement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        itemId:
          type: string
          format: uuid
        warehouseId:
          type: string
          format: uuid
        toWarehouseId:
          type:
            - string
            - "null"
          format: uuid
        type:
          type: string
          enum: &a1
            - IN
            - OUT
            - TRANSFER
        quantity:
          type: integer
        reason:
          type:
            - string
            - "null"
        reference:
          type:
            - string
            - "null"
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - companyId
        - itemId
        - warehouseId
        - toWarehouseId
        - type
        - quantity
        - reason
        - reference
        - createdBy
        - createdAt
    StockLevel:
      type: object
      properties:
        itemId:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        warehouseId:
          type: string
          format: uuid
        quantity:
          type: integer
      required:
        - itemId
        - sku
        - name
        - warehouseId
        - quantity
    MovementResult:
      type: object
      properties:
        movement:
          type: object
          properties:
            id:
              type: string
              format: uuid
            companyId:
              type: string
              format: uuid
            itemId:
              type: string
              format: uuid
            warehouseId:
              type: string
              format: uuid
            toWarehouseId:
              type:
                - string
                - "null"
              format: uuid
            type:
              type: string
              enum: *a1
            quantity:
              type: integer
            reason:
              type:
                - string
                - "null"
            reference:
              type:
                - string
                - "null"
            createdBy:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
          required:
            - id
            - companyId
            - itemId
            - warehouseId
            - toWarehouseId
            - type
            - quantity
            - reason
            - reference
            - createdBy
            - createdAt
        totalQuantity:
          type: integer
          description: Quantité totale de l'article, tous entrepôts
        threshold:
          type: integer
        thresholdCrossed:
          type: boolean
          description: Vrai si ce mouvement a fait passer le total sous le seuil d'alerte
      required:
        - movement
        - totalQuantity
        - threshold
        - thresholdCrossed
  parameters: {}
paths:
  /api/v1/stock/items:
    get:
      summary: Lister les articles
      tags:
        - Articles
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            minimum: 1
            default: 1
          required: false
          name: page
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
          required: false
          name: limit
          in: query
        - schema:
            type: string
            maxLength: 100
          required: false
          name: search
          in: query
        - schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "false"
          required: false
          name: includeArchived
          in: query
      responses:
        "200":
          description: Page d’articles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        companyId:
                          type: string
                          format: uuid
                        sku:
                          type: string
                        name:
                          type: string
                        category:
                          type:
                            - string
                            - "null"
                        unit:
                          type: string
                        threshold:
                          type: integer
                        defaultWarehouseId:
                          type:
                            - string
                            - "null"
                          format: uuid
                        archived:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                      required:
                        - id
                        - companyId
                        - sku
                        - name
                        - category
                        - unit
                        - threshold
                        - defaultWarehouseId
                        - archived
                        - createdAt
                  page:
                    type: integer
                  limit:
                    type: integer
                  total:
                    type: integer
                required:
                  - data
                  - page
                  - limit
                  - total
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                      correlationId:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                      correlationId:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
    post:
      summary: Créer un article (admin, magasinier)
      tags:
        - Articles
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: string
                  minLength: 1
                  maxLength: 64
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                category:
                  type: string
                  maxLength: 100
                unit:
                  type: string
                  minLength: 1
                  maxLength: 20
                  default: pièce
                threshold:
                  type: integer
                  minimum: 0
                  default: 0
                  description: Seuil d'alerte (quantité totale)
                defaultWarehouseId:
                  type: string
                  format: uuid
              required:
                - sku
                - name
      responses:
        "201":
          description: Article créé
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  companyId:
                    type: string
                    format: uuid
                  sku:
                    type: string
                  name:
                    type: string
                  category:
                    type:
                      - string
                      - "null"
                  unit:
                    type: string
                  threshold:
                    type: integer
                  defaultWarehouseId:
                    type:
                      - string
                      - "null"
                    format: uuid
                  archived:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
                required:
                  - id
                  - companyId
                  - sku
                  - name
                  - category
                  - unit
                  - threshold
                  - defaultWarehouseId
                  - archived
                  - createdAt
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                      correlationId:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                      correlationId:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        "403":
          description: Rôle insuffisant
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                      correlationId:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        "409":
          description: Conflit
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                      correlationId:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
