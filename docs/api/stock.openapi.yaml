  /api/v1/stock/movements:
    post:
      summary: Enregistrer une entrée, une sortie ou un transfert (admin, magasinier)
      description: "Transaction unique : mouvement + mise à jour des niveaux, avec
        verrouillage de ligne. Une sortie qui rendrait le stock négatif est
        refusée (409 INSUFFICIENT_STOCK). Un mouvement ne se modifie pas : on le
        corrige par un mouvement inverse."
      tags:
        - Mouvements
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: *a1
                itemId:
                  type: string
                  format: uuid
                warehouseId:
                  type: string
                  format: uuid
                  description: Entrepôt concerné (source pour OUT et TRANSFER)
                toWarehouseId:
                  type: string
                  format: uuid
                  description: Destination, uniquement pour TRANSFER
                quantity:
                  type: integer
                  exclusiveMinimum: 0
                reason:
                  type: string
                  maxLength: 200
                reference:
                  type: string
                  maxLength: 100
              required:
                - type
                - itemId
                - warehouseId
                - quantity
      responses:
        "201":
          description: Mouvement enregistré
          content:
            application/json:
              schema:
                type: object
                properties:
                  movement:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      companyId:
                        type: string
                        format: uuid
                      itemId:
                        type: string
                        format: uuid
                      warehouseId:
                        type: string
                        format: uuid
                      toWarehouseId:
                        type:
                          - string
                          - "null"
                        format: uuid
                      type:
                        type: string
                        enum: *a1
                      quantity:
                        type: integer
                      reason:
                        type:
                          - string
                          - "null"
                      reference:
                        type:
                          - string
                          - "null"
                      createdBy:
                        type: string
                        format: uuid
                      createdAt:
                        type: string
                        format: date-time
                    required:
                      - id
                      - companyId
                      - itemId
                      - warehouseId
                      - toWarehouseId
                      - type
                      - quantity
                      - reason
                      - reference
                      - createdBy
                      - createdAt
                  totalQuantity:
                    type: integer
                    description: Quantité totale de l'article, tous entrepôts
                  threshold:
                    type: integer
                  thresholdCrossed:
                    type: boolean
                    description: Vrai si ce mouvement a fait passer le total sous le seuil d'alerte
                required:
                  - movement
                  - totalQuantity
                  - threshold
                  - thresholdCrossed
        "400":
          description: Données invalides
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                      correlationId:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        "401":
          description: Non authentifié
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                      message:
                        type: string
                      details: {}
                      correlationId:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - error
        "403":
          description: Rôle insuffisant
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
